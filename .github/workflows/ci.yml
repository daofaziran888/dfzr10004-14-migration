name: ci

# 切换顺序：依赖安装 -> 构建与测试 -> 迁移演练 -> 部署切换。
# 任何一步失败都不会触碰线上事件日志；回退时原环境记录仍可从快照读取。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装后端依赖
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: 后端单元测试（含持久化、迁移幂等、失败续跑、版本联动）
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: 迁移演练（临时目录，不产生副作用）
        run: |
          .venv/bin/python -m app.persistence.cli migrate \
            --data-dir "$RUNNER_TEMP/audit-migration-dryrun" \
            --legacy examples/legacy-audit-export.json
          .venv/bin/python -m app.persistence.cli status \
            --data-dir "$RUNNER_TEMP/audit-migration-dryrun"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装前端依赖
        run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 生产构建（构建通过才允许进入切换环节）
        run: npm run build

  # 构建与测试全部通过后才执行的部署切换
  deploy-switch:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 部署切换（迁移可重启恢复，失败保留原数据并记录失败区间）
        run: ./scripts/migrate.sh
      - name: 切换失败时回退（原环境记录仍可读）
        if: failure()
        run: ./scripts/rollback.sh
